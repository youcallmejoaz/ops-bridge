# Local development / evaluation convenience. Builds the production image
# and runs it with your local .env file. For iterative development with
# hot reload, prefer `npm run dev` on the host instead.
services:
  opsbridge-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: 3000
    restart: unless-stopped
